name: Create release

on:
  pull_request:
    types: [closed]
    branches: [ "brighter-than-every-star" ]
  workflow_dispatch:

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'docs/') &&
       !startsWith(github.event.pull_request.head.ref, 'web/'))

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            grub-common \
            grub-pc-bin \
            xorriso \
            mtools  \
            unzip

      - name: Install i686 cross-compilers
        run: |
          mkdir -p $HOME/i686-elf-tools
          curl -L -o tools.zip https://github.com/lordmilko/i686-elf-tools/releases/latest/download/i686-elf-tools-linux.zip
          unzip tools.zip -d $HOME/i686-elf-tools
          echo "$HOME/i686-elf-tools/bin" >> $GITHUB_PATH

      - name: Verify i686 cross-compilers
        run: |
          i686-elf-gcc --version
          i686-elf-as --version
          i686-elf-ld --version

      - name: Build project
        run: |
          cd src
          make release

      - name: Tag
        id: tag
        run: |
          TAG_NAME="v1.0.$(date +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          draft: true
          files: |
            build/release/*
